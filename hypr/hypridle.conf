general {
    # Respect inhibition signals (e.g. YouTube fullscreen won't turn off the screen)
    ignore_dbus_inhibit = false
}

# --- SINGLE RULE: Monitor Management (10 min) ---
listener {
    timeout = 600                            # 10 minutes (600 seconds)
    on-timeout = hyprctl dispatch dpms off   # Turn off video signal
    on-resume = hyprctl dispatch dpms on     # Turn on immediately when activity is detected
    ignore_inhibit = false                   # Respect inhibitions (don't turn off if active signal)
}
